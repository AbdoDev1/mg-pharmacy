{% load staff_ui %}
{% if actions %}
<div class="relative inline-block" x-data="{ open: false }" @click.outside="open = false">
    <button type="button" @click="open = !open"
            class="inline-flex items-center gap-1.5 bg-white hover:bg-gray-50 text-gray-700 text-sm px-4 py-2 rounded-lg border border-gray-300 transition">
        {{ menu_label }}
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>
        </svg>
    </button>
    <div x-show="open" x-cloak x-transition
         class="absolute left-0 {% if direction == 'up' %}bottom-full mb-2{% else %}mt-2{% endif %} w-64 bg-white rounded-lg shadow-lg border border-gray-100 z-20 py-1">
        {% for action in actions %}
        <a href="{{ action.href }}" {% if action.target %}target="{{ action.target }}"{% endif %}
           class="flex items-center gap-2 px-4 py-2 text-sm transition
               {% if action.variant == 'danger' %}text-red-600 hover:bg-red-50{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
            {% if action.icon %}{{ action.icon|icon_svg }}{% endif %}
            {{ action.label }}
        </a>
        {% endfor %}
    </div>
</div>
{% endif %}
