# PgBouncer config — منقول من Biozone (البنية التحتية دي كانت جزء من
# "Stage 3" في خطة أداء Biozone).
#
# This file is committed to git and contains no secrets: credentials are
# supplied separately via the DB_USER/DB_PASSWORD env vars on the
# pgbouncer service in docker-compose.yml, which the edoburu/pgbouncer
# image uses to auto-generate /etc/pgbouncer/userlist.txt (MD5 hash) at
# container startup — that generated file lives only inside the
# container, never on disk here or in git.
#
# Mounted read-only at /etc/pgbouncer/pgbouncer.ini. When this file is
# present, the image's entrypoint script uses it as-is and does not try
# to generate its own.

[databases]
# Wildcard: forward whatever database name the client (Django) asks for
# straight to db:5432, using that same name. Django only ever connects to
# one database, so a wildcard is simpler than hardcoding DB_NAME here and
# needing to keep it in sync with .env.production.
* = host=db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# transaction: each transaction borrows a real Postgres connection and
# returns it immediately after COMMIT/ROLLBACK, instead of holding one for
# the whole client connection's lifetime. This is the right mode for
# Django's request-scoped connection usage, and it's what actually cuts
# down the concurrent-connection pressure on Postgres that CONN_MAX_AGE=60
# used to create. Requires DB_CONN_MAX_AGE=0 in .env.production — Django
# must not try to hold its own connection open across requests when
# PgBouncer is already pooling underneath it.
pool_mode = transaction

# How many client connections (web + celery-worker combined, in MG
# Pharmacy's simpler single-web-service setup) PgBouncer will accept at
# once. Generous headroom above what these services could realistically
# open concurrently.
max_client_conn = 200

# How many real connections PgBouncer keeps open to Postgres per database.
# Chosen well below Postgres's own max_connections so PgBouncer itself
# never becomes the thing exhausting it; adjust upward only if
# `SHOW POOLS;` in the PgBouncer admin console shows clients regularly
# waiting on a full pool during real traffic.
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5

# Reset any session-level state (e.g. search_path, temp tables) before a
# connection goes back into the pool — required for transaction pooling to
# be safe across different clients reusing the same underlying connection.
server_reset_query = DISCARD ALL

# Django (psycopg) sends this startup parameter; older PgBouncer versions
# reject unknown startup parameters outright, so it needs to be ignored
# explicitly rather than passed through.
ignore_startup_parameters = extra_float_digits
