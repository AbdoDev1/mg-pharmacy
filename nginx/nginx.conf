server {
    listen 80;
    # "_" = catch-all: nginx بيستقبل الطلب لأي دومين/Host وصله (localhost،
    # IP السيرفر، دومين حقيقي، أو Cloudflare tunnel) من غير ما نضطر نعدّل
    # الملف ده تاني لما الدومين يتحدد. الحماية الفعلية من دومينات غريبة
    # موجودة أصلًا في Django (ALLOWED_HOSTS في settings.py).
    server_name _;

    client_max_body_size 20M;

    # ضغط الردود الديناميكية (صفحات HTML، ردود htmx للفلاتر، JSON...) قبل
    # ما تتبعت للعميل. من غير ده كان كل رد بيتبعت كامل الحجم، وده مبيبانش
    # وانت بتجرب على نفس الشبكة المحلية (لوكال) لكنه بيبان بوضوح لما الرد
    # بيمشي فعليًا عبر الإنترنت (دومين + Cloudflare Tunnel).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/html;

    location /static/ {
        alias /app/staticfiles/;
        # أسماء الملفات هنا فيها hash من محتواها (CompressedManifestStaticFilesStorage
        # في settings.py، زي tailwind.dbb63bb0311e.css) — أي تعديل في المحتوى
        # بيغيّر الاسم نفسه، فالمتصفح مينفعش "يفوّت" تحديث فعلي حتى لو كاش
        # الملف سنة كاملة. من غير الهيدر ده nginx كان بيسيب الكاش للمتصفح
        # يقرر (Cache-Control: none)، يعني كل زيارة بتعيد تحميل نفس الملفات
        # الثابتة من جديد.
        #
        # gzip_static on: whitenoise (CompressedManifestStaticFilesStorage)
        # بيولّد نسخة .gz جاهزة لكل ملف وقت collectstatic أصلاً — من غير
        # السطر ده nginx كان بيقرأ الملف الأصلي غير المضغوط ويتجاهل النسخة
        # الجاهزة دي بالكامل.
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        # على عكس /static/ فوق، أسماء ملفات /media/ (صور المنتجات/الأقسام)
        # مفيهاش hash من المحتوى — لو صورة اتغيّرت بنفس الاسم، كاش "immutable"
        # هيمنع المتصفح يشوف النسخة الجديدة. فبنستخدم مدة أقصر (7 أيام) بلا
        # immutable، بدل سنة كاملة زي /static/.
        expires 7d;
        add_header Cache-Control "public";
    }

    # جرس الإشعارات اللحظي (WebSocket) — location منفصل عشان نضيف
    # headers الـ Upgrade/Connection اللازمة بس هنا، مش على كل الموقع.
    # من غير الـ headers دي، nginx بيتعامل مع الطلب كـ HTTP عادي وبيقفل
    # الاتصال بعد أول رد (مفيش WebSocket فعلي).
    location /ws/notifications/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;        # اتصال WebSocket لازم يفضل مفتوح لفترة طويلة (مش زي طلب HTTP
        # عادي بيخلص بسرعة) — لو الـ timeout الافتراضي (60s) طبّق هنا
        # هيقفل الاتصال ويرجع الجرس يعتمد على الـ fallback polling بس.
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;        # أكبر شوية من --timeout 60 بتاع gunicorn عمدًا: لو طلب هياخد وقت
        # طويل (زي استيراد إكسل كبير)، نفضّل إن Django/gunicorn هو اللي
        # يقطع الاتصال ويرجّع رسالة مفهومة، مش nginx يرجّع 504 عامة.
        proxy_read_timeout 90s;
    }
}
