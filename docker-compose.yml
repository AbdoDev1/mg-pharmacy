# ============================================================
#  MG Pharmacy — Fork مستقل عن Biozone (Phase 0)
#  لازم هذا المجلد يكون مسار منفصل تمامًا على السيرفر عن مجلد Biozone
#  الأصلي (مش subfolder جواه). شغّل الأوامر دايمًا بعلم -p mgpharmacy
#  صراحةً عشان اسم الـ containers/networks يتفرق عن Biozone حتى لو
#  اتشغّل بالغلط من نفس المسار الأب:
#    docker compose -p mgpharmacy up -d --build
#  Biozone الأصلي بيفضل شغال بالبورت 8080 وباسمه الافتراضي بدون تأثير.
# ============================================================
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:-mgpharmacy}
      POSTGRES_USER: ${DB_USER:-mgpharmacy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data_mgpharmacy:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mgpharmacy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis دلوقتي مستخدم فعليًا كـ CACHES و SESSION_ENGINE في config/settings.py
  # (REDIS_URL بيتقرا من .env.production، افتراضيًا redis://redis:6379/1).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data_mgpharmacy:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    logging: *default-logging
    # DNS عام صريح (بدل ما نعتمد على /etc/resolv.conf بتاع الـ host، اللي
    # بيتقلّد جوه الحاوية تلقائيًا). على سيرفرات سحابية زي Alibaba Cloud،
    # الـ host بيستخدم DNS داخلي خاص (100.100.100.100) شغال بس من على
    # الـ host نفسه — مش قابل للوصول من جوه شبكة Docker الداخلية بتاعة
    # الحاوية، فأي domain خارجي (زي sentry.io) كان بيفشل resolution من
    # جوه web بالتحديد، حتى لو الـ host نفسه شايف الدنيا تمام.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # لو GUNICORN_WORKERS متحدد في .env.production بيتاخد زي ما هو (تحكم
      # يدوي). لو المشروع صغير (عدد عملاء وموظفين محدود) بننصح تحدده يدويًا
      # (GUNICORN_WORKERS=3 مثلًا) بدل الاعتماد على حساب (2×الأنوية)+1
      # التلقائي، لأنه ممكن يشغّل عدد workers أكبر من اللي رام السيرفر
      # تقدر تستحمله لو السيرفر عنده أنوية كتير ورام محدودة.
    volumes:
      - static_volume_mgpharmacy:/app/staticfiles
      # bind mount حقيقي بدل named volume — عشان الصور متتفقدش لو حد
      # شغّل `docker compose down -v` (بيمسح الـ named volumes، لكن
      # مبيلمسش مجلدات الـ host العادية زي ./media). لازم مجلد ./media
      # يكون موجود على الـ host قبل أول تشغيل (docker بيعمله تلقائيًا
      # لو مش موجود، لكن الأفضل تتأكد صلاحيات الكتابة عليه سليمة).
      - ./media:/app/media
      - ./logs:/app/logs
      # الحاوية بقت هي اللي بتعمل pg_dump فعليًا (زرار "تشغيل الآن" +
      # run_backup عبر الكرون) وتكتب هنا مباشرة — مش read-only بقى.
      # لو ./backups نفسه هو نقطة تركيب فلاشة خارجية على السيرفر (راجع
      # تعليق الفلاشة في الرسائل السابقة)، الحاوية هتكتب فيها هي نفسها.
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume_mgpharmacy:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data_mgpharmacy:
  redis_data_mgpharmacy:
  static_volume_mgpharmacy:
