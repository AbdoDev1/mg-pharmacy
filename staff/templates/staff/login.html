{% load static %}
{% load staff_ui %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الموظفين — Biozone</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%231d4ed8%22/><text x=%2212%22 y=%2217%22 font-size=%2214%22 font-family=%22sans-serif%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22>B</text></svg>">
    <link rel="stylesheet" href="{% static 'css/fonts.css' %}">
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
    <style>body { font-family: 'Cairo', system-ui, sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-primary-700">Biozone</h1>
            <p class="text-gray-500 mt-1">نظام إدارة الموظفين</p>
        </div>
        {% if messages %}
        {% for message in messages %}
        <div class="bg-red-100 text-red-700 px-4 py-2 rounded-lg mb-4 text-sm">{{ message }}</div>
        {% endfor %}
        {% endif %}
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="staff_username" class="block text-sm font-medium text-gray-700 mb-1">اسم المستخدم</label>
                <input type="text" name="username" id="staff_username"
                       class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500">
            </div>
            <div>
                <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
                <div class="relative">
                    <input type="password" name="password" id="id_password"
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 pe-10 focus:outline-none focus:ring-2 focus:ring-primary-500">
                    <button type="button" onclick="
                        const f = document.getElementById('id_password');
                        f.type = f.type === 'password' ? 'text' : 'password';
                        this.querySelector('.eye-open').classList.toggle('hidden');
                        this.querySelector('.eye-closed').classList.toggle('hidden');
                        "
                        tabindex="-1"
                        class="absolute inset-y-0 end-0 flex items-center pe-3 text-gray-400 hover:text-gray-600 focus:outline-none">
                        <svg class="eye-open h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10 3.5c-4.5 0-8.3 2.9-9.8 6.5 1.5 3.6 5.3 6.5 9.8 6.5s8.3-2.9 9.8-6.5C18.3 6.4 14.5 3.5 10 3.5Zm0 10.8a4.3 4.3 0 1 1 0-8.6 4.3 4.3 0 0 1 0 8.6Z"/>
                            <path d="M10 8a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/>
                        </svg>
                        <svg class="eye-closed hidden h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3.28 2.22a.75.75 0 0 0-1.06 1.06l14.5 14.5a.75.75 0 1 0 1.06-1.06l-1.84-1.84c1.7-1.2 3.02-2.9 3.86-4.88-1.5-3.6-5.3-6.5-9.8-6.5-1.4 0-2.73.28-3.94.8L3.28 2.22ZM10 6.2c.6 0 1.16.11 1.69.3l-1.6 1.6a2 2 0 0 0-2.4 2.4l-1.6 1.6A4.3 4.3 0 0 1 10 6.2Z" clip-rule="evenodd"/>
                            <path d="m5.02 8.6-1.66-1.66C1.9 8.02 1 9 .2 10c1.5 3.6 5.3 6.5 9.8 6.5.75 0 1.48-.08 2.17-.23l-1.85-1.85a4.3 4.3 0 0 1-5-5.83Z"/>
                        </svg>
                    </button>
                </div>
            </div>
            {% btn "تسجيل الدخول" type="submit" full_width=True %}
        </form>
        <p class="text-center text-xs text-gray-400 mt-6">
            هل أنت عميل؟ <a href="{% url 'accounts:login' %}" class="text-primary-600 hover:underline">سجّل الدخول من هنا</a>
        </p>
    </div>
</body>
</html>
